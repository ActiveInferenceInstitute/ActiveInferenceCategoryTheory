name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job, one environment. Every check is an arm of ./run.sh, so the workflow
# holds no copy of a command: checkout, interpreter, and installs happen once
# for both the offline documentation gate and the pinned GNN conformance check.
jobs:
  gate:
    name: docs gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python with uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448 # AII standard 7159e67
        with:
          python-version: "3.12"
          enable-cache: "false"
      # The composite action installs uv and CPython into uv's managed store.
      # This seeded environment puts that interpreter on PATH as `python3`, which
      # is what ./run.sh uses for every arm.
      - name: Create the pinned Python environment
        run: |
          uv venv --seed --python 3.12 "$RUNNER_TEMP/python"
          echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
      - name: Install the gate environment
        run: ./run.sh setup
      - name: links and metadata
        run: ./run.sh docs
      - name: gnn conformance (pinned)
        run: ./run.sh gnn
